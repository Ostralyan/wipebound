[package]
name = "wipebound-backend"
version = "0.1.0"
edition = "2021"
description = "Ladder and run ingestion for Wipebound. Not a game server."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

diesel = { version = "2", features = ["postgres", "chrono"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }

# Depended on directly so Cargo's feature unification gives diesel-async the
# async-await feature it needs; without it the build fails inside that crate on
# a missing futures_util::try_join.
futures-util = "0.3"
scoped-futures = "0.1"
chrono = { version = "0.4", features = ["serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
